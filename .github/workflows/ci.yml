name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  api-tests:
    name: Backend API Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, pdo_pgsql, pgsql
          coverage: none

      - name: Install Dependencies
        working-directory: ./apps/api
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Generate Key
        working-directory: ./apps/api
        run: php artisan key:generate --env=testing

      - name: Run Tests
        working-directory: ./apps/api
        run: php artisan test

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Lint Frontend
        working-directory: ./apps/frontend
        run: npm run lint

      - name: Type Check Frontend
        working-directory: ./apps/frontend
        run: npx tsc --noEmit

      - name: Build Frontend
        working-directory: ./apps/frontend
        env:
          NODE_ENV: production
        run: npm run build

  e2e-tests:
    name: E2E QA Tests
    needs: [api-tests, frontend-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Generate .env
        run: |
          cat > .env <<EOF
          APP_KEY=base64:$(openssl rand -base64 32)
          DB_DATABASE=basileia
          DB_USERNAME=basileia
          DB_PASSWORD=ci_$(openssl rand -hex 8)
          REDIS_PASSWORD=ci_$(openssl rand -hex 8)
          SECURITY_ENCRYPTION_KEY=base64:$(openssl rand -base64 32)
          SECURITY_IP_SALT=$(openssl rand -hex 16)
          MASTER_TOTP_SEED=$(openssl rand -hex 32)
          APP_URL=http://localhost:8000
          SANCTUM_STATEFUL_DOMAINS=localhost,127.0.0.1
          CORS_ALLOWED_ORIGINS=http://localhost:8000
          EOF

      - name: Start Docker Compose
        run: docker compose up -d

      - name: Wait for Healthchecks
        timeout-minutes: 2
        run: |
          sleep 10
          while ! curl -A "CI-Healthcheck" -s -f http://localhost:8000/api/health > /dev/null; do
            echo "Waiting for API to be healthy..."
            sleep 5
          done
          echo "API is healthy!"

      - name: Dump Docker logs on failure
        if: failure()
        run: docker compose logs api

      - name: Run E2E Tests
        run: |
          npm ci
          cd apps/frontend
          npm run e2e
