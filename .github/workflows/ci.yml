name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  api-tests:
    name: Backend API Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, pdo_pgsql, pgsql
          coverage: none

      - name: Install Dependencies
        working-directory: ./apps/api
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Generate Key
        working-directory: ./apps/api
        run: php artisan key:generate --env=testing

      - name: Run Tests
        working-directory: ./apps/api
        run: php artisan test

  dashboard-build:
    name: Dashboard Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Lint Dashboard
        working-directory: ./apps/dashboard
        run: npm run lint

      - name: Type Check Dashboard
        working-directory: ./apps/dashboard
        run: npx tsc --noEmit

      - name: Build Dashboard
        working-directory: ./apps/dashboard
        env:
          NODE_ENV: production
        run: npm run build

  e2e-tests:
    name: E2E QA Tests
    needs: [api-tests, dashboard-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Start Docker Compose
        run: docker compose up -d

      - name: Wait for Healthchecks
        run: |
          sleep 10
          while ! curl -s -f http://localhost:8000/api/health > /dev/null; do
            echo "Waiting for API to be healthy..."
            sleep 5
          done
          echo "API is healthy!"

      - name: Run E2E Tests
        run: |
          npm ci
          cd apps/dashboard
          npm run e2e
