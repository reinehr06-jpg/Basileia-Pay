services:
  # ── Reverse Proxy (public-facing only) ──
  app:
    image: nginx:alpine
    restart: unless-stopped
    environment:
      - FORCE_RESTART=2
    ports:
      - "8000:8000"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      api:
        condition: service_healthy
      dashboard:
        condition: service_healthy

    networks:
      - proxy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── API (backend) ──
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_KEY=${APP_KEY:-base64:LcfW0Q+z6b1/fD3t9C8gZ4j6X6o8mD1T8a5Y3W7M3Gg=}
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-basileia}
      - DB_USERNAME=${DB_USERNAME:-basileia}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - SESSION_DRIVER=database
      - CACHE_STORE=database
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD:-secret}
      - QUEUE_CONNECTION=redis
      - APP_URL=${APP_URL:-https://secure.basileia.global}
      - FRONTEND_URL=${FRONTEND_URL:-https://secure.basileia.global}
      - SANCTUM_STATEFUL_DOMAINS=${SANCTUM_STATEFUL_DOMAINS:-localhost,127.0.0.1}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      - SENTRY_LARAVEL_DSN=${SENTRY_LARAVEL_DSN:-}
      - SENTRY_TRACES_SAMPLE_RATE=${SENTRY_TRACES_SAMPLE_RATE:-0.1}
      - SECURITY_ENCRYPTION_KEY=${SECURITY_ENCRYPTION_KEY:-secret}
      - SECURITY_IP_SALT=${SECURITY_IP_SALT:-secret}
      - MASTER_TOTP_SEED=${MASTER_TOTP_SEED:-secret}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - proxy
      - internal
    volumes:
      - api_storage:/var/www/html/storage
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s

  # ── Dashboard (frontend) ──
  dashboard:
    container_name: check-out-dashboard-v2
    build:
      context: ./apps/dashboard
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=/api
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=/api
      - NODE_ENV=production
    depends_on:
      api:
        condition: service_healthy
    networks:
      - proxy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/health || test -f /tmp/index.html"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s


  # ── PostgreSQL (internal only) ──
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    expose:
      - "5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-basileia}
      POSTGRES_USER: ${DB_USERNAME:-basileia}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-basileia} -d ${DB_DATABASE:-basileia}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis (internal only, for queue/cache when configured) ──
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-secret} --appendonly yes
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── Queue Worker ──
  queue-worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    command: php artisan queue:work redis --tries=3 --timeout=90
    environment:
      - APP_ENV=production
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-basileia}
      - DB_USERNAME=${DB_USERNAME:-basileia}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - QUEUE_CONNECTION=redis
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD:-secret}
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # ── Scheduler ──
  scheduler:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    command: php artisan schedule:work
    environment:
      - APP_ENV=production
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-basileia}
      - DB_USERNAME=${DB_USERNAME:-basileia}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - QUEUE_CONNECTION=redis
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD:-secret}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 256M

volumes:
  pgdata:
  redis_data:
  api_storage:

networks:
  proxy:
    driver: bridge
    internal: false
  internal:
    driver: bridge
    internal: true
